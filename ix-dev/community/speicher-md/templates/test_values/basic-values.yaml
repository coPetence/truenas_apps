resources:
  limits:
    cpus: 2.0
    memory: 4096

TZ: Etc/UTC

speicher:
  postgres_image_selector: postgres_17_image
  db_password: secret
  public_url: ""
  additional_envs: []

network:
  web_port:
    bind_mode: published
    port_number: 8080

run_as:
  user: 568
  group: 568

ix_volumes:
  postgres_data: /opt/tests/mnt/speicher-md/postgres_data
  speicher_data: /opt/tests/mnt/speicher-md/speicher_data

storage:
  postgres_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: postgres_data
      create_host_path: true
  speicher_data:
    type: ix_volume
    ix_volume_config:
      dataset_name: speicher_data
      create_host_path: true
  additional_storage: []
